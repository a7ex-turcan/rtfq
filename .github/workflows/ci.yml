name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors, including trim and AOT analysis. ADR 0001 found a
      # guard that passed every JIT test and failed open once published, and every
      # warning in that spike pointed at real breakage.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/Rtfq.Server.Tests --no-build -c Release --verbosity normal

      # Real containerised PostgreSQL. No mocks for adapters.
      - name: Integration tests
        run: dotnet test tests/Rtfq.Adapters.Tests --no-build -c Release --verbosity normal

  # The build above proves the code compiles. This proves what actually ships.
  # A JIT-only test run does not tell us how the published binary behaves.
  aot-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install NativeAOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish NativeAOT
        run: dotnet publish src/Rtfq.Cli -c Release -r linux-x64 -o out

      # The sample references its secrets rather than inlining them, so validating
      # it requires the same variables an operator would export.
      - name: Smoke-test the published binary
        env:
          RTFQ_TOKEN_AGENT: ci-smoke-token
          ORDERS_DSN: Host=localhost;Port=5432;Database=orders;Username=rtfq
        run: |
          ./out/rtfq --version
          ./out/rtfq validate --config examples/rtfq.dev.yaml

      # Production mode must refuse the development sample, which listens without
      # TLS. Asserting the specific check keeps this a regression test: exiting
      # non-zero for some other reason would otherwise look like a pass.
      - name: Production mode refuses the development sample
        env:
          RTFQ_TOKEN_AGENT: ci-smoke-token
          ORDERS_DSN: Host=localhost;Port=5432;Database=orders;Username=rtfq
        run: |
          if output=$(./out/rtfq validate --config examples/rtfq.dev.yaml --production 2>&1); then
            echo "::error::production validation accepted a config with no TLS"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'server.tls.production' || {
            echo "::error::refused, but not by the TLS rule this step exists to test"
            exit 1
          }

      # Unresolvable secrets must fail loudly rather than defaulting to empty.
      # This exact case broke the first CI run, so it stays as a regression test.
      - name: Unresolvable secret references are refused
        run: |
          if output=$(./out/rtfq validate --config examples/rtfq.dev.yaml 2>&1); then
            echo "::error::validation passed with RTFQ_TOKEN_AGENT and ORDERS_DSN unset"
            exit 1
          fi
          echo "$output" | grep -q 'config.secret_unresolved' || {
            echo "::error::refused, but not by the unresolved-secret rule"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: rtfq-linux-x64
          path: out/rtfq
