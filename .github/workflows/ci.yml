name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors, including trim and AOT analysis. ADR 0001 found a
      # guard that passed every JIT test and failed open once published, and every
      # warning in that spike pointed at real breakage.
      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/Rtfq.Server.Tests --no-build -c Release --verbosity normal

      # Real containerised PostgreSQL. No mocks for adapters.
      - name: Integration tests
        run: dotnet test tests/Rtfq.Adapters.Tests --no-build -c Release --verbosity normal

  # The build above proves the code compiles. This proves what actually ships.
  # A JIT-only test run does not tell us how the published binary behaves.
  aot-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Built inside Ubuntu 22.04 rather than on the runner, and CI uses the same
      # path as the release so the thing tested is the thing shipped.
      #
      # A binary links against the build host's glibc. Building on the runner
      # (24.04, glibc 2.39) produced one requiring GLIBC_2.38, which will not
      # start on Debian 12, Ubuntu 22.04 or RHEL 9 — all ordinary targets for a
      # self-hosted tool. Jammy's 2.35 brings the floor down to 2.34.
      - name: Publish NativeAOT on an old-glibc base
        run: |
          # pipefail, because the tee below otherwise reports ITS exit code and a
          # failed publish passes the step. That is not hypothetical: an AOT trim
          # error shipped green here once, and the two checks after it passed on a
          # binary that had never been produced.
          set -o pipefail

          docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl clang zlib1g-dev ca-certificates
            curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/di.sh
            bash /tmp/di.sh --channel 10.0 --install-dir /usr/share/dotnet --no-path
            export PATH=/usr/share/dotnet:$PATH DOTNET_NOLOGO=1 DOTNET_CLI_TELEMETRY_OPTOUT=1
            dotnet publish src/Rtfq.Cli -c Release -r linux-x64 -o out
          ' 2>&1 | tee publish.log
          sudo chown -R "$USER" out publish.log

      # A dependency that raises the floor again should fail here, not in an
      # issue from someone on Debian.
      - name: The glibc floor stays low enough for Debian 12 and RHEL 9
        run: |
          ceiling=2.34

          # Assert the subject exists before measuring it. Without this, objdump
          # on a missing file yields an empty string, the comparison below finds
          # nothing above the ceiling, and the step passes having checked nothing.
          [ -x out/rtfq ] || { echo "::error::out/rtfq was not produced"; exit 1; }

          highest=$(objdump -T out/rtfq | grep -oE 'GLIBC_2\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -1)
          [ -n "$highest" ] || { echo "::error::no GLIBC symbols found; objdump read nothing"; exit 1; }

          echo "highest glibc symbol required: $highest (ceiling $ceiling)"
          if [ "$(printf '%s\n%s\n' "$highest" "$ceiling" | sort -V | tail -1)" != "$ceiling" ]; then
            echo "::error::binary requires glibc $highest, above the $ceiling ceiling"
            echo "::error::that excludes RHEL 9, Ubuntu 22.04 and Debian 12"
            objdump -T out/rtfq | grep "GLIBC_$highest"
            exit 1
          fi

      # IL2104/IL3053 are warnings rather than errors because six third-party
      # assemblies contain reflective code (see Directory.Build.props). That
      # allowance is policed rather than remembered: a NEW dirty assembly means
      # code nobody has verified against the published binary.
      - name: Only the known assemblies may produce trim warnings
        run: |
          # Same trap: an empty publish.log has no unexpected assemblies in it.
          [ -s publish.log ] || { echo "::error::publish.log is empty"; exit 1; }

          # An IL2026/IL3050 in OUR code is an error, not a warning, and it kills
          # the publish. Caught here too, named, because the message that matters
          # is "this line is AOT-hostile" rather than a linker exit code.
          if grep -qE "^/src/src/.*(Trim analysis error|AOT analysis error)" publish.log; then
            echo "::error::our own code produced a trim or AOT analysis error:"
            grep -E "^/src/src/.*(Trim analysis error|AOT analysis error)" publish.log
            exit 1
          fi

          allowed="Microsoft.Data.SqlClient|Microsoft.Data.SqlClient.Internal.Logging|Microsoft.SqlServer.TransactSql.ScriptDom|MongoDB.Bson|MongoDB.Driver|System.Configuration.ConfigurationManager"
          found=$(grep -oE "Assembly '[A-Za-z0-9._]+'" publish.log | sed -E "s/Assembly '(.*)'/\1/" | sort -u || true)
          echo "assemblies producing trim warnings:"; echo "$found" | sed 's/^/  /'
          unexpected=$(echo "$found" | grep -vE "^($allowed)$" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected assembly producing trim warnings: $unexpected"
            echo "::error::verify it against the published binary before adding it to the allow-list"
            exit 1
          fi

      # The sample references its secrets rather than inlining them, so validating
      # it requires the same variables an operator would export.
      - name: Smoke-test the published binary
        env:
          RTFQ_AGENT_SECRET: ci-smoke-token
          ORDERS_DSN: Host=localhost;Port=5432;Database=orders;Username=rtfq
        run: |
          ./out/rtfq --version
          ./out/rtfq validate --config examples/rtfq.dev.yaml

      # Production mode must refuse the development sample, which listens without
      # TLS. Asserting the specific check keeps this a regression test: exiting
      # non-zero for some other reason would otherwise look like a pass.
      - name: Production mode refuses the development sample
        env:
          RTFQ_AGENT_SECRET: ci-smoke-token
          ORDERS_DSN: Host=localhost;Port=5432;Database=orders;Username=rtfq
        run: |
          if output=$(./out/rtfq validate --config examples/rtfq.dev.yaml --production 2>&1); then
            echo "::error::production validation accepted a config with no TLS"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q 'server.tls.production' || {
            echo "::error::refused, but not by the TLS rule this step exists to test"
            exit 1
          }

      # The multi-source example is the production shape: every kind, TLS, and
      # secrets by reference. It must validate under --production, or the
      # documentation is showing people a config that would be refused.
      - name: The multi-source example passes production validation
        env:
          RTFQ_READONLY_SECRET: ci-token
          RTFQ_WRITER_SECRET: ci-writer-token
          APPROVAL_TOKEN: ci-approval-token
          ORDERS_DSN: Host=localhost;Database=orders;Username=rtfq
          WAREHOUSE_DSN: Server=localhost;Database=wh;User Id=rtfq;Password=x
          CATALOG_URI: mongodb://localhost:27017
          BILLING_TOKEN: Bearer ci-token
        run: |
          mkdir -p /tmp/tls && touch /tmp/tls/tls.crt /tmp/tls/tls.key
          export RTFQ_TLS_CERT=/tmp/tls/tls.crt RTFQ_TLS_KEY=/tmp/tls/tls.key
          ./out/rtfq validate --config examples/rtfq.multi.yaml --production

      # Unresolvable secrets must fail loudly rather than defaulting to empty.
      # This exact case broke the first CI run, so it stays as a regression test.
      - name: Unresolvable secret references are refused
        run: |
          if output=$(./out/rtfq validate --config examples/rtfq.dev.yaml 2>&1); then
            echo "::error::validation passed with RTFQ_AGENT_SECRET and ORDERS_DSN unset"
            exit 1
          fi
          echo "$output" | grep -q 'config.secret_unresolved' || {
            echo "::error::refused, but not by the unresolved-secret rule"
            exit 1
          }

      # An approval provider that cannot be reached approves nothing, so a
      # misconfigured one has to be caught at validate time rather than at the
      # moment somebody is waiting on it. Each case asserts its own named check:
      # exiting non-zero for some other reason would otherwise look like a pass.
      - name: A misconfigured approval provider is refused before anyone waits on it
        env:
          RTFQ_AGENT_SECRET: ci-token
          ORDERS_DSN: Host=localhost;Database=orders;Username=rtfq
        run: |
          check() {
            name=$1; want=$2
            { cat examples/rtfq.dev.yaml; cat /tmp/fragment.yaml; } > /tmp/approval.yaml
            if output=$(./out/rtfq validate --config /tmp/approval.yaml 2>&1); then
              echo "::error::$name: validation accepted it"
              exit 1
            fi
            echo "$output" | grep -q "$want" || {
              echo "::error::$name: refused, but not by $want"
              echo "$output"
              exit 1
            }
            echo "ok: $name -> $want"
          }

          cat > /tmp/fragment.yaml <<YAML
          approval:
            mode: webhook
          YAML
          check "webhook with no endpoint" approval.endpoint_missing

          cat > /tmp/fragment.yaml <<YAML
          approval:
            mode: slack
          YAML
          check "an unknown mode" approval.mode_unknown

          cat > /tmp/fragment.yaml <<YAML
          approval:
            mode: webhook
            endpoint: approvals.internal
          YAML
          check "an endpoint that is not a URL" approval.endpoint_malformed

      - uses: actions/upload-artifact@v7
        with:
          name: rtfq-linux-x64
          path: out/rtfq
